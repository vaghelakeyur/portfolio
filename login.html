<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyur Portfolio | Login</title>
    <link
      rel="shortcut icon"
      href="assets/images/favicon.svg"
      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Toastr CSS -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(135deg, #1f1f1f, #121212);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }

      .login-box {
        background-color: #1e1e1e;
        padding: 2.5rem 2rem;
        border-radius: 15px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
        animation: fadeIn 1s ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-box h2 {
        text-align: center;
        margin-bottom: 1.5rem;
        color: #00ffff;
        font-weight: bold;
      }

      .form-control {
        background-color: #2a2a2a;
        border: none;
        color: #fff;
      }

      .form-control:focus {
        background-color: #2a2a2a;
        color: #fff;
        box-shadow: 0 0 0 0.2rem rgba(0, 255, 255, 0.2);
      }

      .btn-custom {
        background-color: #00ffff;
        color: #121212;
        border: none;
        font-weight: bold;
        transition: all 0.3s ease-in-out;
      }

      .btn-custom:hover {
        background-color: #00d4d4;
      }

      .position-relative i {
        position: absolute;
        right: 15px;
        top: 38px;
        cursor: pointer;
        color: #ccc;
      }

      .form-label i {
        margin-right: 8px;
        color: #00ffff;
      }
    </style>
  </head>

  <body>
    <div class="login-box">
      <h2><i class="fas fa-user-lock"></i> Login</h2>
      <form id="SubmitForm">
        <div class="mb-3">
          <label for="username" class="form-label">
            <i class="fas fa-user"></i> Username
          </label>
          <input
            type="text"
            class="form-control"
            id="username"
            placeholder="Enter your username"
          />
        </div>

        <div class="mb-3 position-relative">
          <label for="password" class="form-label">
            <i class="fas fa-lock"></i> Password
          </label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Enter your password"
          />
          <i
            class="fas fa-eye toggle-password"
            id="togglePassword"
            onclick="togglePassword()"
          ></i>
        </div>

        <button type="submit" class="btn btn-custom w-100">Login</button>
      </form>
    </div>

    <!-- Toastr JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <script>
      // Optional Toastr settings
      toastr.options = {
        closeButton: true,
        progressBar: true,
        positionClass: "toast-top-right",
        timeOut: "3000",
      };

      function togglePassword() {
        const passwordField = document.getElementById("password");
        const toggleIcon = document.getElementById("togglePassword");
        const type =
          passwordField.getAttribute("type") === "password"
            ? "text"
            : "password";
        passwordField.setAttribute("type", type);
        toggleIcon.classList.toggle("fa-eye");
        toggleIcon.classList.toggle("fa-eye-slash");
      }

      document.getElementById("SubmitForm").addEventListener("submit", (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        if (username === "") {
          toastr.error("Username is empty. Please fill the field.");
          return false;
        }

        if (password === "") {
          toastr.error("Password is empty. Please fill the field.");
          return false;
        }

        if (username === "keyur vaghela" && password === "keyur9016") {
          toastr.success("Hi Keyur! Admin panel login successful.");

          setTimeout(() => {
            window.location.href = "AdminKeyur/index.html";
          }, 1000);

          localStorage.setItem("isLoggedIn", true);
          localStorage.setItem("username", username);

          sessionStorage("isLoggedIn", true);
          sessionStorage("username", username);
        } else if (username !== "keyur vaghela") {
          toastr.warning("Wrong username. Please enter the correct username.");
        } else if (password !== "keyur9016") {
          toastr.warning("Wrong password. Please enter the correct password.");
        } else {
          toastr.error("Something went wrong!");
        }
      });
    </script>
  </body>
</html>
